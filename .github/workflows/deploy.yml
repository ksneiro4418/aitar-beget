# Автосборка и деплой на Beget по FTP.
# Срабатывает при пуше в main (в т.ч. когда CMS сохраняет правки) и вручную.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
# (GitHub → Settings → Secrets and variables → Actions). Подробности — в README.md.
name: Build & Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ to Beget (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Контент и медиа редактируются на Beget через /cms/ — деплой их НЕ трогает
          # (иначе перетёр бы правки редактора). Также не трогаем данные админки.
          exclude: |
            **/.git*
            **/.git*/**
            content/**
            uploads/**
            cms/_data/**
